<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fingertip contact estimates</title>
<style>
  body { margin: 0; font-family: "Times New Roman", Times, serif; background: #fff; color: #000; }
  #page { display: flex; flex-direction: column; height: 100vh; }
  #top { border-bottom: 1px solid #000; padding: 3px 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; }
  #top h1 { font-size: 16px; margin: 0 6px 0 0; }
  #top label { white-space: nowrap; }
  #top input[type=range] { width: 90px; vertical-align: middle; }
  #rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .row { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; border-bottom: 1px solid #000; }
  .view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .side { padding: 4px 8px; overflow-y: auto; border-left: 1px solid #000; font-size: 12px; }
  .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .head b { font-size: 15px; }
  .head select, .head button { font-family: inherit; font-size: 12px; padding: 0 3px; }
  .head select { max-width: 210px; }
  .status { font-size: 11px; height: 2.4em; overflow: hidden; margin: 2px 0; }
  .contact { font-size: 15px; margin: 1px 0 3px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 3px; }
  td, th { border: 1px solid #000; padding: 0 4px; text-align: right; font-size: 12px; }
  th { text-align: left; font-weight: normal; }
  canvas.trace { border: 1px solid #000; display: block; margin-top: 3px; }
  .settings { font-size: 10.5px; margin-top: 3px; color: #222; }
  .legend { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: rgba(255,255,255,0.85); padding: 2px 4px; border: 1px solid #000; }
  .name { position: absolute; left: 6px; top: 4px; font-size: 15px; background: rgba(255,255,255,0.85); padding: 0 4px; }
  .cbar { display: inline-block; vertical-align: middle; width: 110px; height: 8px; border: 1px solid #000; background: linear-gradient(to right, #d8d8d8, #ffe08a, #ff9a3c, #e0301e, #7a0010); }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="page">
  <div id="top">
    <h1>Fingertip contact estimates</h1>
    <label>Shown above <span id="mfl">0.25</span> N <input type="range" id="mf" min="0.05" max="2" step="0.05" value="0.25"></label>
    <label>Noise floor <span id="fll">2.00</span> uT <input type="range" id="fl" min="0" max="5" step="0.25" value="2"></label>
    <label><input type="checkbox" id="az" checked> re-zero at rest (z)</label>
    <label><input type="checkbox" id="ff"> reject fields from outside the pad (f)</label>
    <label>Deformation x<span id="exl">20</span> <input type="range" id="ex" min="1" max="100" value="20"></label>
    <label>Arrow <span id="arl">4</span> mm/N <input type="range" id="ar" min="1" max="20" value="4"></label>
    <label>Indenter <span id="rl">8</span> mm <input type="checkbox" id="showind"> show <input type="range" id="rr" min="2" max="40" value="8"></label>
    <label>Pressure scale <span id="pml">300</span> kPa <input type="range" id="pm" min="5" max="1000" value="300"></label>
    <span>Keys for every board: b baseline, c recalibrate at rest, r record, z, f, g next estimate</span>
  </div>
  <div id="rows"></div>
</div>
<template id="row-tpl">
  <div class="row">
    <div class="view"><div class="name"></div>
      <div class="legend">Pressure (kPa) 0 <span class="cbar"></span> <span class="pmax">300</span>. Magnets: red north toward the palm, blue south. Arrow: force on the pad.</div>
    </div>
    <div class="side">
      <div class="head"><b class="title"></b>
        <select class="mode" title="estimate shown (g cycles every board)"></select>
        <button class="bb" title="new baseline">b</button><button class="bc" title="recalibrate at rest">c</button><button class="br" title="record the stream">r</button>
      </div>
      <div class="status">connecting</div>
      <div class="contact">no data</div>
      <table>
        <tr><th>Surface</th><td colspan="3" class="wh">-</td></tr>
        <tr><th>Press, shear t1, t2 (N)</th><td class="fp">-</td><td class="f1">-</td><td class="f2">-</td></tr>
        <tr><th>1-sigma of the physical model</th><td class="sfp">-</td><td class="sf1">-</td><td class="sf2">-</td></tr>
        <tr><th>Contact point x, y, z (mm)</th><td colspan="3" class="pxyz">-</td></tr>
        <tr><th>Point 1-sigma t1, t2; peak</th><td class="sp1">-</td><td class="sp2">-</td><td class="pk">-</td></tr>
        <tr><th>Chi-square explained; shown above</th><td class="ee">-</td><td colspan="2" class="thr">-</td></tr>
        <tr><th>Chips since calibration; background</th><td class="tt">-</td><td colspan="2" class="gg">-</td></tr>
      </table>
      <canvas class="trace tf" width="362" height="84"></canvas>
      <canvas class="trace tp" width="362" height="70"></canvas>
      <canvas class="trace tb" width="362" height="56"></canvas>
      <div class="settings"></div>
    </div>
  </div>
</template>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const T = p => new THREE.Vector3(p[2], p[0], p[1]);      // tip (x normal, y across, z along) -> three (z, x, y)
const $ = id => document.getElementById(id);
const ex = $('ex'), ar = $('ar'), rr = $('rr'), pm = $('pm'), mf = $('mf'), fl = $('fl'), az = $('az'), ff = $('ff');
const stops = [[0, [0.85, 0.85, 0.85]], [0.25, [1, 0.88, 0.54]], [0.5, [1, 0.60, 0.24]], [0.75, [0.88, 0.19, 0.12]], [1, [0.48, 0, 0.06]]];
function cmap(v) {
  v = Math.max(0, Math.min(1, v));
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a);
    return ca.map((x, k) => x + t * (cb[k] - x));
  }
  return stops[stops.length - 1][1];
}
function fmt(v, d = 2) { return (v >= 0 ? ' ' : '') + v.toFixed(d); }
function label(text, pos) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d'); g.font = '34px Times New Roman'; g.fillStyle = '#000'; g.fillText(text, 4, 44);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(5, 1.25, 1); s.position.copy(pos); return s;
}

let ws = null;
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

class Board {
  constructor(k, name) {
    this.k = k; this.name = name; this.hist = []; this.face = null;
    const node = $('row-tpl').content.firstElementChild.cloneNode(true);
    $('rows').appendChild(node);
    this.q = sel => node.querySelector(sel);
    this.view = this.q('.view');
    this.q('.name').textContent = name; this.q('.title').textContent = name;
    this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    this.renderer.setPixelRatio(window.devicePixelRatio);
    this.view.appendChild(this.renderer.domElement);
    const scene = this.scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
    this.camera = new THREE.PerspectiveCamera(35, 1, 0.1, 500); this.camera.position.set(44, 26, 30);
    this.controls = new OrbitControls(this.camera, this.renderer.domElement); this.controls.target.set(10.5, 1, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(-10, 40, 20); scene.add(dl);
    this.arrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 4, 0x0040ff, 1.2, 0.8);
    this.arrow.visible = false; scene.add(this.arrow);
    this.ellGeo = new THREE.BufferGeometry(); this.ellPts = new Float32Array(65 * 3);
    this.ellGeo.setAttribute('position', new THREE.BufferAttribute(this.ellPts, 3));
    this.ell = new THREE.LineLoop(this.ellGeo, new THREE.LineBasicMaterial({ color: 0x0040ff })); this.ell.visible = false; scene.add(this.ell);
    this.ind = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshPhongMaterial({ color: 0x3060ff, transparent: true, opacity: 0.05, depthWrite: false }));
    this.ind.visible = false; scene.add(this.ind);
    this.extras = new THREE.Group(); scene.add(this.extras);
    this.q('.bb').onclick = () => send({ cmd: 'baseline', board: k });
    this.q('.bc').onclick = () => send({ cmd: 'calibrate', board: k });
    this.q('.br').onclick = () => send({ cmd: 'record', board: k });
    this.q('.mode').onchange = e => send({ cmd: 'mode', mode: e.target.value, board: k });
  }
  resize() {
    const w = this.view.clientWidth, h = this.view.clientHeight;
    this.renderer.setSize(w, h); this.camera.aspect = w / Math.max(h, 1); this.camera.updateProjectionMatrix();
  }
  buildScene(m) {
    const scene = this.scene;
    if (this.face) { scene.remove(this.face); scene.remove(this.wire); }
    this.extras.clear();
    this.nV = m.verts.length;
    this.rest = new Float32Array(this.nV * 3);
    m.verts.forEach((p, i) => { const v = T(p); this.rest.set([v.x, v.y, v.z], 3 * i); });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.rest.slice(), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.nV * 3).fill(0.85), 3));
    geo.setIndex(m.tris.flat()); geo.computeVertexNormals();
    this.face = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, shininess: 20 }));
    scene.add(this.face);
    this.wire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.08 }));
    scene.add(this.wire);
    for (const mg of m.magnets) {
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(mg.d / 2, mg.d / 2, mg.t, 24), new THREE.MeshPhongMaterial({ color: mg.pole > 0 ? 0xd02020 : 0x2040d0 }));
      cyl.position.copy(T(mg.c)); this.extras.add(cyl);
    }
    for (const ch of m.chips) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(3, 0.9, 3), new THREE.MeshPhongMaterial({ color: 0x303030 }));
      b.position.copy(T(ch.p)); this.extras.add(b);
      this.extras.add(label(`${ch.U} ${ch.addr}`, T([ch.p[0] - 1.5, ch.p[1], ch.p[2]])));
    }
    const board = new THREE.Mesh(new THREE.BoxGeometry(20, 0.6, 20), new THREE.MeshPhongMaterial({ color: 0x2a7a2a, transparent: true, opacity: 0.35 }));
    const c0 = m.chips.find(c => c.U === 'U1') || m.chips[0];
    board.position.copy(T([c0.p[0] - 0.42 - 0.9 - 0.3, c0.p[1], c0.p[2]])); this.extras.add(board);
    this.q('.thr').textContent = m.threshold;
    if (m.min_force !== undefined && this.k === 0) {
      mf.value = m.min_force; $('mfl').textContent = (+m.min_force).toFixed(2);
      fl.value = m.floor; $('fll').textContent = (+m.floor).toFixed(2);
      az.checked = !!m.auto; ff.checked = !!m.foreign; rr.value = m.R; $('rl').textContent = m.R;
    }
    if (m.modes) {
      const s = this.q('.mode'); s.innerHTML = '';
      for (const md of m.modes) { const o = document.createElement('option'); o.value = md; o.textContent = m.mode_names[md] || md; s.appendChild(o); }
      s.value = m.mode;
    }
  }
  onFrame(m) {
    this.q('.status').textContent = m.status || '';
    if (m.settings) this.q('.settings').textContent = m.settings;
    if (m.dT) { const sg = v => (v >= 0 ? '+' : '') + v.toFixed(1); this.q('.tt').textContent = `${sg(Math.min(...m.dT))} to ${sg(Math.max(...m.dT))} C`; }
    if (m.mode && this.q('.mode').value !== m.mode) this.q('.mode').value = m.mode;
    if (m.type !== 'frame' || !this.face) return;
    const pos = this.face.geometry.attributes.position, cA = this.face.geometry.attributes.color, rest = this.rest, nV = this.nV;
    const hist = this.hist;
    if (hist.length && m.t < hist[hist.length - 1].t) hist.length = 0;      // a replay started over
    let k = +ex.value * 1e-3;
    if (m.contact) {
      let umax = 0;
      for (let i = 0; i < m.u.length; i++) umax = Math.max(umax, Math.abs(m.u[i]));
      k = Math.min(k, 2.0 / Math.max(umax, 1e-6));                          // drawn displacement at most 2 mm
      for (let i = 0; i < nV; i++) {
        const u = T([m.u[3 * i], m.u[3 * i + 1], m.u[3 * i + 2]]);
        pos.array[3 * i] = rest[3 * i] + k * u.x; pos.array[3 * i + 1] = rest[3 * i + 1] + k * u.y; pos.array[3 * i + 2] = rest[3 * i + 2] + k * u.z;
        cA.array.set(cmap(m.pr[i] / +pm.value), 3 * i);
      }
      const F = T(m.f), L = Math.min(F.length() * +ar.value, 25), q = T(m.p), dir = F.clone().normalize();
      this.arrow.position.copy(q.clone().sub(dir.clone().multiplyScalar(L))); this.arrow.setDirection(dir);
      this.arrow.setLength(Math.max(L, 0.5), Math.min(1.2, 0.4 * L + 0.3), Math.min(0.8, 0.3 * L + 0.2)); this.arrow.visible = true;
      const [a, b, th] = m.ell;
      for (let j = 0; j <= 64; j++) {
        const t = 2 * Math.PI * j / 64, d1 = a * Math.cos(t) * Math.cos(th) - b * Math.sin(t) * Math.sin(th), d2 = a * Math.cos(t) * Math.sin(th) + b * Math.sin(t) * Math.cos(th);
        const v = T([0, 1, 2].map(c => m.p[c] + 0.08 * m.n[c] + d1 * m.t1[c] + d2 * m.t2[c])); this.ellPts.set([v.x, v.y, v.z], 3 * j);
      }
      this.ellGeo.attributes.position.needsUpdate = true; this.ell.visible = m.mode === 'physical';
      this.ind.scale.setScalar(+rr.value); this.ind.position.copy(T([0, 1, 2].map(c => m.p[c] + +rr.value * m.n[c]))); this.ind.visible = $('showind').checked;
      this.q('.contact').textContent = `Contact, ${m.fn.toFixed(2)} N pressing`;
      this.q('.wh').textContent = m.where;
      for (const [cl, v] of [['.fp', m.fn], ['.f1', m.ft[0]], ['.f2', m.ft[1]]]) this.q(cl).textContent = fmt(v);
      this.q('.pxyz').textContent = m.p.map(v => v.toFixed(1)).join(', ');
      for (const [cl, j] of [['.sfp', 0], ['.sf1', 1], ['.sf2', 2], ['.sp1', 3], ['.sp2', 4]]) this.q(cl).textContent = m.sd[j].toFixed(2);
      this.q('.pk').textContent = `${m.pmax.toFixed(0)} kPa`;
    } else {
      pos.array.set(rest); cA.array.fill(0.85); this.arrow.visible = false; this.ell.visible = false; this.ind.visible = false;
      this.q('.contact').textContent = m.foreign ? 'No contact: a field from outside the pad' : 'No contact';
      for (const cl of ['.wh', '.fp', '.f1', '.f2', '.pxyz', '.sfp', '.sf1', '.sf2', '.sp1', '.sp2', '.pk']) this.q(cl).textContent = '-';
    }
    this.q('.ee').textContent = m.e.toFixed(0);
    if (m.g) this.q('.gg').textContent = m.g.map(v => v.toFixed(0)).join(', ') + ' uT';
    pos.needsUpdate = true; cA.needsUpdate = true; this.face.geometry.computeVertexNormals();
    hist.push({ t: m.t, fp: m.contact ? m.fn : 0, ft: m.contact ? Math.hypot(m.ft[0], m.ft[1]) : 0,
                x: m.contact ? m.p[0] : NaN, y: m.contact ? m.p[1] : NaN, z: m.contact ? m.p[2] : NaN, db: m.db });
    while (hist.length && m.t - hist[0].t > 10) hist.shift();
    this.drawTraces();
  }
  plot(cv, series, lo, hi, ylab) {
    const g = cv.getContext('2d'), W = cv.width, H = cv.height, L = 28, B = 12, hist = this.hist;
    g.clearRect(0, 0, W, H); g.font = '11px Times New Roman'; g.fillStyle = '#000';
    g.strokeStyle = '#000'; g.strokeRect(L, 2, W - L - 2, H - B - 2);
    const t1 = hist.length ? hist[hist.length - 1].t : 0;
    const X = t => L + (W - L - 2) * (1 - (t1 - t) / 10), Y = v => 2 + (H - B - 4) * (1 - (v - lo) / (hi - lo));
    g.fillText(hi.toFixed(hi < 10 ? 1 : 0), 2, 11); g.fillText(lo.toFixed(lo > -10 ? 1 : 0), 2, H - B);
    g.fillText(ylab, L + 4, 12); g.fillText('last 10 s', W - 46, H - 2);
    for (const [key, col] of series) {
      g.strokeStyle = col; g.beginPath(); let pen = false;
      for (const h of hist) { const v = h[key]; if (!isFinite(v)) { pen = false; continue; }
        const x = X(h.t), y = Y(Math.max(lo, Math.min(hi, v))); pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; }
      g.stroke();
    }
  }
  drawTraces() {
    const hist = this.hist, fmax = Math.max(1, ...hist.map(h => Math.max(h.fp, h.ft))) * 1.1;
    this.plot(this.q('.tf'), [['fp', '#c00000'], ['ft', '#0040ff']], 0, fmax, 'Force (N): pressing red, shear blue');
    this.plot(this.q('.tp'), [['x', '#c06000'], ['y', '#008000'], ['z', '#800080']], -8, 22, 'Point (mm): x orange, y green, z purple');
    const cv = this.q('.tb'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height); g.font = '11px Times New Roman'; g.fillStyle = '#000';
    const last = hist.length ? hist[hist.length - 1].db : null;
    g.fillText('Field change per chip axis (uT), x y z of 0x0C 0x11 0x12 0x13 0x10', 4, 10);
    if (last) {
      const mx = Math.max(10, ...last.map(Math.abs)), w = (cv.width - 8) / 15, y0 = 14 + (cv.height - 16) / 2;
      g.strokeStyle = '#000'; g.beginPath(); g.moveTo(4, y0); g.lineTo(cv.width - 4, y0); g.stroke();
      last.forEach((v, i) => { g.fillStyle = ['#c00000', '#008000', '#0040ff'][i % 3];
        const h = (cv.height - 20) / 2 * v / mx; g.fillRect(4 + i * w + 1, Math.min(y0, y0 - h), w - 2, Math.abs(h)); });
      g.fillStyle = '#000'; g.fillText(`+-${mx.toFixed(0)}`, cv.width - 34, cv.height - 2);
    }
  }
}

let boards = [];
function setBoards(names) {
  if (boards.length === names.length && boards.every((b, i) => b.name === names[i])) return;
  $('rows').innerHTML = ''; boards = names.map((n, k) => new Board(k, n)); resize();
}
for (const [el, lbl] of [[ex, 'exl'], [ar, 'arl'], [rr, 'rl'], [pm, 'pml']])
  el.addEventListener('input', () => { $(lbl).textContent = el.value; if (lbl === 'pml') for (const n of document.querySelectorAll('.pmax')) n.textContent = el.value; });
rr.addEventListener('change', () => send({ cmd: 'indenter', R: +rr.value }));
mf.addEventListener('input', () => { $('mfl').textContent = (+mf.value).toFixed(2); });
mf.addEventListener('change', () => send({ cmd: 'minforce', N: +mf.value }));
fl.addEventListener('input', () => { $('fll').textContent = (+fl.value).toFixed(2); });
fl.addEventListener('change', () => send({ cmd: 'floor', uT: +fl.value }));
az.addEventListener('change', () => send({ cmd: 'autozero', on: az.checked }));
ff.addEventListener('change', () => send({ cmd: 'foreign', on: ff.checked }));

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'boards') { setBoards(m.names); return; }
    if (!boards.length) setBoards(['fingertip']);
    const b = boards[m.board || 0]; if (!b) return;
    if (m.type === 'scene') b.buildScene(m); else b.onFrame(m);
  };
  ws.onclose = () => { for (const b of boards) b.q('.status').textContent = 'disconnected; retrying'; setTimeout(connect, 1000); };
}
connect();
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'b') send({ cmd: 'baseline' }); if (e.key === 'c') send({ cmd: 'calibrate' }); if (e.key === 'r') send({ cmd: 'record' });
  if (e.key === 'z') { az.checked = !az.checked; send({ cmd: 'autozero', on: az.checked }); }
  if (e.key === 'f') { ff.checked = !ff.checked; send({ cmd: 'foreign', on: ff.checked }); }
  if (e.key === 'g') send({ cmd: 'mode' });
});
function resize() { for (const b of boards) b.resize(); }
window.addEventListener('resize', resize);
(function loop() { requestAnimationFrame(loop); for (const b of boards) { b.controls.update(); b.renderer.render(b.scene, b.camera); } })();
</script>
</body>
</html>
