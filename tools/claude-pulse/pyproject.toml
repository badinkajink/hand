[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-pulse"
version = "0.1.0"
description = "Non-LLM monitor that tops up idle Claude usage windows with scheduled pokes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "badinkajink" }]
keywords = ["claude", "anthropic", "usage", "monitor", "quota", "rate-limit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
# Zero runtime dependencies: pure standard library, for maximum portability.
dependencies = []

[project.scripts]
claude-pulse = "claude_pulse.cli:main"

[project.urls]
Homepage = "https://github.com/badinkajink/claude-pulse"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_pulse"]

[tool.hatch.build.targets.sdist]
include = ["src/claude_pulse", "tests", "deploy", "README.md", "claude-pulse.example.toml"]
