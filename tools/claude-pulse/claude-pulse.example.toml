# claude-pulse configuration (TOML).
#
# Search order (first found wins): --config PATH, $CLAUDE_PULSE_CONFIG,
# ./claude-pulse.toml, ~/.config/claude-pulse/config.toml.
# Every field can also be set via CLI flags or CLAUDE_PULSE_* env vars.
#
# Copy this to ~/.config/claude-pulse/config.toml and edit.

# --- where Claude Code keeps its usage logs -----------------------------
# Leave empty to auto-detect (~/.claude/projects, $CLAUDE_CONFIG_DIR/projects).
# data_dirs = ["~/.claude/projects"]

session_hours = 5.0            # rolling window length ("resets every 5 hours")

# --- when to poke -------------------------------------------------------
# Poke only after this much *inactivity*. Your real work AND our own pokes
# both count as activity, so the monitor defers to you and self-spaces.
poke_after_idle_minutes = 120  # ~ every 2 hours while idle

check_interval_minutes = 10    # how often the daemon re-evaluates
min_window_left_minutes = 20   # don't poke if the window resets very soon

# If false (default) the monitor may open a brand-new window when none is
# active -- i.e. it keeps availability warm even after a long idle stretch,
# which is usually what "use my leftover quota overnight" wants.
# Set true to ONLY top up windows you already opened with real work.
require_active_window = false

# Optional guard rails (uncomment to enable):
# window_token_budget = 5000000  # stop poking once a window hits N tokens
# max_pokes_per_window = 3        # cap our own pokes per 5h window
# quiet_hours = ["01:00-06:00"]   # local-time ranges where we never poke

# --- what the poke does -------------------------------------------------
# Default: a trivial, tool-free keep-alive prompt via the claude CLI.
command = ["claude", "-p", "{prompt}"]
prompt = "This is an automated keep-alive ping from claude-pulse. Reply with exactly: pulse ok. Do not use any tools."
# cwd = "/path/to/project"       # working dir for the command
timeout_seconds = 300

# Make the idle quota productive instead of a no-op. Examples:
#   command = ["claude", "-p", "{prompt}"]
#   prompt  = "Read TODO.md, pick the top unchecked item, implement it, and commit."
# or run an arbitrary script:
#   command = ["bash", "/home/me/bin/nightly_agent.sh"]

# --- bookkeeping --------------------------------------------------------
state_dir = "~/.claude-pulse"
# log_file = "~/.claude-pulse/pulse.log"

# dry_run = true   # evaluate + log, but never actually run the command
